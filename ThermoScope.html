<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThermoScope</title>
<style>
/* =============================================================================
 * ThermoScope — design system
 * A restrained, instrument-panel aesthetic: one accent, hairline borders, tight
 * spacing, custom-styled controls. Colors come from CSS variables set by theme.js.
 * ============================================================================= */

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
:root {
  --r: 7px; --r-sm: 5px; --r-lg: 10px;
  --fs: 13px; --fs-sm: 12px; --fs-xs: 11px;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  --ui: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --sp: 10px;
  --dur: .14s;
}
body {
  font-family: var(--ui);
  font-size: var(--fs);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}
button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; }
input, select { font-family: inherit; font-size: inherit; }
::selection { background: var(--accent-weak); }

/* scrollbars */
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------------------------------------------------------------- layout ---- */
#app { display: flex; flex-direction: column; height: 100vh; }
.menubar {
  display: flex; align-items: center; height: 38px; flex: 0 0 auto;
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 8px; gap: 2px; user-select: none; position: relative; z-index: 60;
}
.brand { display: flex; align-items: center; gap: 8px; padding: 0 12px 0 6px; font-weight: 700; letter-spacing: .2px; }
.brand .logo { width: 20px; height: 20px; display: block; }
.brand .sub { font-weight: 500; color: var(--text-3); font-size: var(--fs-xs); }
.menubar .spacer { flex: 1; }
.menubar .status-chip { font-size: var(--fs-xs); color: var(--text-3); padding: 0 10px; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.menu-item { position: relative; }
.menu-btn {
  background: transparent; border: 0; padding: 6px 11px; border-radius: var(--r-sm);
  color: var(--text-2); font-weight: 500;
}
.menu-btn:hover, .menu-item.open .menu-btn { background: var(--surface-3); color: var(--text); }
.menu-dropdown {
  position: absolute; top: calc(100% + 4px); left: 0; min-width: 230px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
  box-shadow: var(--menu-shadow); padding: 5px; z-index: 100; display: none;
}
.menu-item.open .menu-dropdown { display: block; }
.menu-row {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  background: transparent; border: 0; padding: 7px 9px; border-radius: var(--r-sm);
  color: var(--text); white-space: nowrap;
}
.menu-row:hover { background: var(--accent-weak); color: var(--accent-text); }
.menu-row .key { margin-left: auto; color: var(--text-3); font-size: var(--fs-xs); font-family: var(--mono); }
.menu-row.disabled { color: var(--text-3); pointer-events: none; opacity: .55; }
.menu-row .check { width: 14px; text-align: center; color: var(--accent); }
.menu-sep { height: 1px; background: var(--border-2); margin: 5px 4px; }

/* toolbar */
.toolbar {
  display: flex; align-items: center; gap: 6px; height: 46px; flex: 0 0 auto;
  padding: 0 10px; background: var(--surface); border-bottom: 1px solid var(--border);
  overflow-x: auto; z-index: 50;
}
.toolbar .group { display: flex; align-items: center; gap: 5px; }
.toolbar .divider { width: 1px; height: 22px; background: var(--border); margin: 0 5px; flex: 0 0 auto; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm);
  color: var(--text); font-weight: 500; transition: background var(--dur), border-color var(--dur);
  white-space: nowrap;
}
.btn:hover { background: var(--surface-3); }
.btn:active { transform: translateY(.5px); }
.btn svg { width: 15px; height: 15px; flex: 0 0 auto; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.icon { padding: 0; width: 30px; justify-content: center; }
.btn.sm { height: 26px; padding: 0 9px; font-size: var(--fs-sm); }
.btn.sm.icon { width: 26px; }
.btn.xs { height: 24px; padding: 0 8px; font-size: var(--fs-xs); }
.btn.xs svg { width: 13px; height: 13px; }
.btn:disabled { opacity: .45; pointer-events: none; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-3); }
.btn.active { background: var(--accent-weak); border-color: var(--accent); color: var(--accent-text); }

/* segmented control */
.segmented { display: inline-flex; background: var(--sunken); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 2px; gap: 2px; }
.segmented button {
  border: 0; background: transparent; color: var(--text-2); padding: 4px 11px; border-radius: 4px;
  font-weight: 500; height: 24px; transition: all var(--dur);
}
.segmented button:hover { color: var(--text); }
.segmented button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

/* workspace */
.workspace { flex: 1; display: flex; min-height: 0; }
.panel { background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.panel-left { width: 264px; flex: 0 0 auto; border-right: 1px solid var(--border); }
.panel-right { width: 320px; flex: 0 0 auto; border-left: 1px solid var(--border); }
.panel.collapsed { display: none; }
.panel-scroll { overflow-y: auto; overflow-x: hidden; flex: 1; }
.center { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }

/* panel sections */
.section { border-bottom: 1px solid var(--border-2); }
.section-head {
  display: flex; align-items: center; gap: 8px; padding: 9px 13px; cursor: pointer; user-select: none;
  font-weight: 600; font-size: var(--fs-sm); color: var(--text); letter-spacing: .2px;
}
.section-head .chev { margin-left: auto; color: var(--text-3); transition: transform var(--dur); }
.section.collapsed .chev { transform: rotate(-90deg); }
.section.collapsed .section-body { display: none; }
.section-body { padding: 4px 13px 14px; }
.section-head .count { margin-left: auto; font-size: var(--fs-xs); color: var(--text-3); background: var(--surface-3); padding: 1px 7px; border-radius: 20px; }
.section-head .count + .chev { margin-left: 8px; }

.field { margin: 10px 0; }
.field > label { display: block; font-size: var(--fs-xs); color: var(--text-3); margin-bottom: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.hint { font-size: var(--fs-xs); color: var(--text-3); line-height: 1.45; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

/* text input / select */
.input, select.input {
  height: 30px; width: 100%; background: var(--sunken); border: 1px solid var(--border);
  border-radius: var(--r-sm); padding: 0 9px; color: var(--text); outline: none; transition: border-color var(--dur), box-shadow var(--dur);
}
.input:focus, select.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
textarea.input { height: auto; padding: 7px 9px; resize: vertical; line-height: 1.5; }
.input.mono { font-family: var(--mono); }

/* custom select arrow */
.select-wrap { position: relative; }
.select-wrap::after {
  content: ""; position: absolute; right: 11px; top: 50%; width: 7px; height: 7px; pointer-events: none;
  border-right: 2px solid var(--text-3); border-bottom: 2px solid var(--text-3); transform: translateY(-65%) rotate(45deg);
}
select.input { -webkit-appearance: none; appearance: none; padding-right: 26px; cursor: pointer; }

/* custom checkbox */
.chk { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; user-select: none; font-size: var(--fs-sm); }
.chk input { position: absolute; opacity: 0; width: 0; height: 0; }
.chk .box {
  width: 17px; height: 17px; border-radius: 5px; border: 1.5px solid var(--border); background: var(--sunken);
  display: inline-flex; align-items: center; justify-content: center; transition: all var(--dur); flex: 0 0 auto;
}
.chk .box svg { width: 11px; height: 11px; stroke: #fff; stroke-width: 3; fill: none; opacity: 0; transition: opacity var(--dur); }
.chk input:checked + .box { background: var(--accent); border-color: var(--accent); }
.chk input:checked + .box svg { opacity: 1; }
.chk input:focus-visible + .box { box-shadow: 0 0 0 3px var(--accent-weak); }
.chk:hover .box { border-color: var(--text-3); }

/* custom radio (seg/list) */
.radio-list { display: flex; flex-direction: column; gap: 2px; }
.radio-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-sm); cursor: pointer; border: 1px solid transparent; }
.radio-row:hover { background: var(--surface-2); }
.radio-row.on { background: var(--accent-weak); border-color: var(--accent); }
.radio-row .dot { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--border); flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; }
.radio-row.on .dot { border-color: var(--accent); }
.radio-row.on .dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.radio-row .rl-title { font-weight: 500; }
.radio-row .rl-sub { font-size: var(--fs-xs); color: var(--text-3); }

/* custom range slider */
input[type=range].slider { -webkit-appearance: none; appearance: none; width: 100%; height: 20px; background: transparent; cursor: pointer; }
input[type=range].slider::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; background: var(--border); }
input[type=range].slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); margin-top: -6px; box-shadow: var(--shadow-sm); transition: transform var(--dur); }
input[type=range].slider::-webkit-slider-thumb:hover { transform: scale(1.12); }
input[type=range].slider:focus-visible { outline: none; }
input[type=range].slider:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px var(--accent-weak); }
input[type=range].slider:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 4px var(--accent-weak); }
input[type=range].slider::-moz-range-track { height: 5px; border-radius: 3px; background: var(--border); }
input[type=range].slider::-moz-range-thumb { width: 15px; height: 15px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }

/* color swatch button */
.swatch { width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--border); padding: 0; flex: 0 0 auto; position: relative; overflow: hidden; }
.swatch::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); border-radius: 4px; }

/* dataset list */
.ds-bulk { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 9px; }
.ds-list { display: flex; flex-direction: column; gap: 3px; }
.ds-row { display: flex; align-items: center; gap: 8px; padding: 6px 7px; border-radius: var(--r-sm); border: 1px solid transparent; }
.ds-row:hover { background: var(--surface-2); border-color: var(--border-2); }
.ds-row .ds-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-sm); }
.ds-row.dim .ds-label { opacity: .5; }
.ds-row.off .ds-label { opacity: .35; text-decoration: line-through; }
.vis-btn { width: 24px; height: 24px; border-radius: 5px; border: 1px solid var(--border); background: var(--surface-2); display: inline-flex; align-items: center; justify-content: center; color: var(--text-2); }
.vis-btn:hover { background: var(--surface-3); }
.vis-btn svg { width: 14px; height: 14px; }

/* tabs */
.tabs { display: flex; gap: 2px; padding: 6px 10px 0; background: var(--bg); border-bottom: 1px solid var(--border); flex: 0 0 auto; }
.tab { border: 0; background: transparent; color: var(--text-2); padding: 8px 15px; border-radius: var(--r-sm) var(--r-sm) 0 0; font-weight: 500; position: relative; }
.tab:hover { color: var(--text); }
.tab.on { color: var(--text); }
.tab.on::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; background: var(--accent); border-radius: 2px; }
.tab-body { flex: 1; min-height: 0; position: relative; }
.tab-pane { position: absolute; inset: 0; display: none; flex-direction: column; }
.tab-pane.on { display: flex; }

/* chart */
.chart-toolbar { display: flex; align-items: center; gap: 8px; padding: 9px 12px; flex: 0 0 auto; flex-wrap: wrap; }
.chart-toolbar .lbl { font-size: var(--fs-xs); color: var(--text-3); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
.chart-stage { flex: 1; display: flex; min-height: 0; padding: 0 12px 6px; gap: 8px; }
.chart-wrap { flex: 1; position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow-sm); }
.chart-wrap canvas { display: block; position: absolute; inset: 0; }
/* vertical pan bar = a standard horizontal slider rotated, so both bars share
   identical track/thumb thickness (JS sets its width to the chart height). */
.y-pan { width: 22px; position: relative; flex: 0 0 auto; }
.y-pan input[type=range] { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-90deg); margin: 0; }
.x-pan-row { display: flex; align-items: center; gap: 10px; padding: 2px 44px 10px 12px; flex: 0 0 auto; }
.x-pan-row .zoom-hint { font-size: var(--fs-xs); color: var(--text-3); white-space: nowrap; }
.x-pan-row input[type=range] { flex: 1; }

/* hover tooltip */
.tooltip {
  position: fixed; z-index: 200; pointer-events: none; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--menu-shadow);
  padding: 8px 10px; font-size: var(--fs-sm); max-width: 260px; display: none;
}
.tooltip .tt-title { font-weight: 600; margin-bottom: 5px; display: flex; align-items: center; gap: 6px; }
.tooltip .tt-row { display: flex; justify-content: space-between; gap: 16px; font-family: var(--mono); font-size: var(--fs-xs); color: var(--text-2); padding: 1px 0; }
.tooltip .tt-row .v { color: var(--text); }
.tt-swatch { width: 9px; height: 9px; border-radius: 2px; flex: 0 0 auto; }

/* analysis cards */
.tool { border-bottom: 1px solid var(--border-2); }
.tool-head { display: flex; align-items: center; gap: 9px; padding: 10px 13px; cursor: pointer; user-select: none; }
.tool-head .t-ico { width: 16px; height: 16px; color: var(--text-3); flex: 0 0 auto; }
.tool-head .t-name { font-weight: 600; font-size: var(--fs-sm); }
.tool-head .chev { margin-left: auto; color: var(--text-3); transition: transform var(--dur); }
.tool.collapsed .chev { transform: rotate(-90deg); }
.tool.collapsed .tool-body { display: none; }
.tool-body { padding: 2px 13px 14px; }
.tool.active .t-ico { color: var(--accent); }
.readout { background: var(--sunken); border: 1px solid var(--border-2); border-radius: var(--r-sm); padding: 8px 10px; font-family: var(--mono); font-size: var(--fs-xs); color: var(--text-2); line-height: 1.7; margin-top: 8px; }
.readout .rk { color: var(--text-3); }
.readout .rv { color: var(--text); float: right; }
.readout .th-head { margin-top: 6px; }
.readout .th-head:first-child { margin-top: 0; }
.readout .th-head .rk { float: right; font-weight: 400; }
.readout .th-dir.up { color: var(--danger); }
.readout .th-dir.down { color: var(--accent); }
.link-btn { background: none; border: none; padding: 2px 0; margin: 1px 0 4px; color: var(--accent); font: inherit; font-size: var(--fs-xs); cursor: pointer; }
.link-btn:hover { text-decoration: underline; }

/* manual plot entries */
.mp-entry { display: flex; align-items: center; gap: 7px; padding: 5px 0; }
.mp-entry .swatch { width: 18px; height: 18px; }
.mp-entry .mp-expr { flex: 1; font-family: var(--mono); font-size: var(--fs-xs); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mp-entry .x { color: var(--text-3); }
.mp-entry .x:hover { color: var(--danger); }

/* Inline click-to-rename control (stat names, chart title). Long text fades out
 * at the right edge instead of wrapping; a pencil appears on hover. */
.editable { flex: 1; min-width: 0; display: flex; align-items: center; gap: 5px; cursor: text; border-radius: var(--r-sm); padding: 3px 5px; margin: -3px -3px; }
.editable:hover { background: var(--surface-2); }
.editable-text { flex: 1; min-width: 0; font-size: var(--fs-xs); white-space: nowrap; overflow: hidden;
  -webkit-mask-image: linear-gradient(90deg, #000 80%, transparent); mask-image: linear-gradient(90deg, #000 80%, transparent); }
.editable-pencil { flex: 0 0 auto; width: 13px; height: 13px; color: var(--text-3); opacity: 0; transition: opacity .12s; }
.editable:hover .editable-pencil { opacity: .8; }
.editable-pencil svg { width: 13px; height: 13px; display: block; }
.editable-input { flex: 1; min-width: 0; height: 24px; background: var(--sunken); border: 1px solid var(--accent);
  border-radius: var(--r-sm); padding: 0 6px; color: var(--text); outline: none; font-size: var(--fs-xs); box-shadow: 0 0 0 3px var(--accent-weak); }

/* status bar */
.statusbar {
  height: 26px; flex: 0 0 auto; display: flex; align-items: center; gap: 14px; padding: 0 12px;
  background: var(--surface); border-top: 1px solid var(--border); font-size: var(--fs-xs); color: var(--text-3);
}
.statusbar .sb-item { display: flex; align-items: center; gap: 6px; font-family: var(--mono); }
.statusbar .sb-item b { color: var(--text-2); font-weight: 600; }
.statusbar .sb-spacer { flex: 1; }

/* details grid */
.details-wrap { overflow: auto; padding: 18px 22px; }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 12px; }
.detail-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 13px 15px; }
.detail-card h4 { margin: 0 0 10px; font-size: var(--fs); }
.detail-card .kv { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; font-size: var(--fs-sm); border-bottom: 1px dashed var(--border-2); }
.detail-card .kv:last-child { border-bottom: 0; }
.detail-card .kv .k { color: var(--text-3); }
.detail-card .kv .v { color: var(--text); font-family: var(--mono); text-align: right; }
.page-title { font-size: 17px; font-weight: 700; margin: 0; }
.page-sub { color: var(--text-3); font-size: var(--fs-sm); margin: 3px 0 0; }

/* raw data */
.raw-wrap { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.raw-toolbar { display: flex; align-items: center; gap: 10px; padding: 12px; flex-wrap: wrap; }
.raw-scroll { overflow: auto; flex: 1; margin: 0 12px 12px; border: 1px solid var(--border); border-radius: var(--r); }
table.data-table { border-collapse: collapse; width: 100%; font-family: var(--mono); font-size: var(--fs-xs); }
table.data-table th { position: sticky; top: 0; background: var(--surface-3); color: var(--text-2); text-align: right; padding: 7px 12px; font-weight: 600; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.data-table td { text-align: right; padding: 5px 12px; border-bottom: 1px solid var(--border-2); color: var(--text); white-space: nowrap; }
table.data-table tr:hover td { background: var(--surface-2); }
table.data-table td.idx, table.data-table th.idx { color: var(--text-3); text-align: left; width: 34px; min-width: 34px; padding-left: 12px; padding-right: 4px; }
/* Pin # and Time on the left so Time (the independent variable) holds a fixed
   position right next to the sample number, no matter how many thermocouples. */
table.data-table th.idx, table.data-table td.idx { position: sticky; left: 0; }
table.data-table th.time, table.data-table td.time { position: sticky; left: 34px; text-align: left; padding-left: 6px; border-right: 1px solid var(--border); }
table.data-table th.idx, table.data-table th.time { z-index: 3; }
table.data-table td.idx, table.data-table td.time { z-index: 1; background: var(--bg); }
table.data-table td.time { font-weight: 600; }
table.data-table tr:hover td.idx, table.data-table tr:hover td.time { background: var(--surface-2); }

/* empty state */
.empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--text-3); text-align: center; padding: 24px; }
.empty svg { width: 46px; height: 46px; opacity: .5; }
.empty h3 { margin: 0; color: var(--text-2); font-size: 15px; }
.empty p { margin: 0; max-width: 340px; line-height: 1.5; }

/* modal */
.overlay { position: fixed; inset: 0; background: rgba(6,9,14,.5); display: none; align-items: center; justify-content: center; z-index: 300; padding: 20px; }
.overlay.on { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--menu-shadow); width: 100%; max-width: 460px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
.modal.wide { max-width: 620px; }
.modal-head { display: flex; align-items: center; padding: 15px 18px; border-bottom: 1px solid var(--border-2); }
.modal-head h3 { margin: 0; font-size: 15px; }
.modal-head .x { margin-left: auto; }
.modal-body { padding: 16px 18px; overflow: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 13px 18px; border-top: 1px solid var(--border-2); background: var(--surface-2); }

/* toast */
.toast-host { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 400; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast { background: var(--text); color: var(--surface); padding: 9px 16px; border-radius: 20px; font-size: var(--fs-sm); box-shadow: var(--menu-shadow); opacity: 0; transform: translateY(8px); transition: all .2s; font-weight: 500; }
.toast.show { opacity: 1; transform: none; }

/* manual-item rows */
.mp-entry .mp-label { flex: 1; height: 26px; min-width: 0; background: var(--sunken); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 0 8px; color: var(--text); outline: none; font-size: var(--fs-xs); }
.mp-entry .mp-label:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
.mp-entry .mini { width: 26px; height: 26px; flex: 0 0 auto; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); }
.mp-entry .mini:hover { background: var(--surface-3); }
.mp-entry .mini svg { width: 14px; height: 14px; }
.mp-entry .mini.off { color: var(--text-3); opacity: .6; }

/* custom color picker popover */
.color-pop { position: fixed; z-index: 350; width: 238px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--menu-shadow); padding: 12px; }

/* Generic anchored popover (color manager, etc.) */
.pop-panel { position: fixed; z-index: 350; width: 232px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--menu-shadow); padding: 12px; }
.pop-title { font-weight: 700; font-size: var(--fs-sm); color: var(--text); margin-bottom: 4px; }
.pop-hint { font-size: var(--fs-xs); color: var(--text-3); line-height: 1.5; margin: 0 0 4px; }
.pop-cap { font-size: 10px; text-transform: uppercase; letter-spacing: .4px; font-weight: 600; color: var(--text-3); margin: 12px 0 6px; }
.pop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.pop-sep { height: 1px; background: var(--border-2); margin: 12px 0; }
.btn.block { width: 100%; justify-content: center; }
.btn.block svg { width: 14px; height: 14px; }
.cp-sv { position: relative; width: 214px; height: 130px; border-radius: var(--r-sm); cursor: crosshair; border: 1px solid var(--border); }
.cp-sv-thumb { position: absolute; width: 13px; height: 13px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.5); transform: translate(-50%, -50%); pointer-events: none; }
.cp-hue { position: relative; height: 12px; border-radius: 6px; margin-top: 12px; cursor: pointer;
  background: linear-gradient(to right,#f00 0%,#ff0 17%,#0f0 33%,#0ff 50%,#00f 67%,#f0f 83%,#f00 100%); }
.cp-hue-thumb { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.5); transform: translate(-50%, -50%); pointer-events: none; }
.cp-presets { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin-top: 12px; }
.cp-preset { height: 16px; border-radius: 4px; border: 1px solid var(--border); padding: 0; cursor: pointer; }
.cp-preset:hover { outline: 2px solid var(--accent); outline-offset: 1px; }
.cp-fields { display: flex; gap: 6px; margin-top: 12px; align-items: center; }
.cp-fields .input { height: 28px; text-align: center; padding: 0 5px; }
.cp-fields .cp-hex { flex: 1; text-transform: uppercase; }
.cp-fields .cp-rgb { width: 40px; }
.cp-preview { width: 30px; height: 28px; border-radius: 5px; border: 1px solid var(--border); flex: 0 0 auto; }
.cp-cap { font-size: 10px; color: var(--text-3); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; text-align: center; width: 40px; }

/* skipped-files warning */
.warn-banner { display: flex; gap: 12px; align-items: flex-start; background: var(--warn-weak); border: 1px solid var(--warn-border); border-radius: var(--r); padding: 12px 14px; }
.warn-banner .warn-ico { color: var(--warn-ink); flex: 0 0 auto; margin-top: 1px; }
.warn-banner .warn-ico svg { width: 20px; height: 20px; }
.file-list { max-height: 220px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--sunken); }
.file-list-row { display: flex; align-items: center; gap: 10px; padding: 8px 11px; border-bottom: 1px solid var(--border-2); }
.file-list-row:last-child { border-bottom: 0; }
.file-list-row .fl-name { flex: 1; min-width: 0; font-family: var(--mono); font-size: var(--fs-xs); color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-list-row .fl-reason { flex: 0 0 auto; font-size: var(--fs-xs); color: var(--warn-ink); background: var(--warn-weak); border-radius: 20px; padding: 2px 9px; white-space: nowrap; }

/* preferences dialog — left rail + content pane */
.prefs { display: flex; border: 1px solid var(--border-2); border-radius: var(--r); overflow: hidden; min-height: 360px; }
.prefs-rail { width: 158px; flex: 0 0 auto; background: var(--surface-2); border-right: 1px solid var(--border-2); padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.prefs-rail button { display: flex; align-items: center; gap: 9px; text-align: left; background: transparent; border: 0; padding: 8px 10px; border-radius: var(--r-sm); color: var(--text-2); font-weight: 500; }
.prefs-rail button svg { width: 15px; height: 15px; flex: 0 0 auto; }
.prefs-rail button:hover { background: var(--surface-3); color: var(--text); }
.prefs-rail button.on { background: var(--accent-weak); color: var(--accent-text); }
.prefs-pane { flex: 1; padding: 6px 18px 16px; min-width: 0; }
.prefs-pane h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-3); margin: 16px 0 4px; }
.pref-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; padding: 12px 0; border-bottom: 1px solid var(--border-2); }
.pref-row:last-child { border-bottom: 0; }
.pref-label { font-weight: 500; }
.pref-desc { font-size: var(--fs-xs); color: var(--text-3); margin-top: 3px; max-width: 300px; line-height: 1.45; }
.pref-control { flex: 0 0 auto; padding-top: 1px; }
.pref-disabled { opacity: .5; pointer-events: none; }
.accent-swatches { display: flex; gap: 9px; }
.accent-sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; box-shadow: 0 0 0 1px var(--border); padding: 0; cursor: pointer; position: relative; }
.accent-sw:hover { transform: scale(1.08); }
.accent-sw.on { border-color: var(--surface); box-shadow: 0 0 0 2px currentColor; }

/* interface density */
:root[data-density="compact"] { --fs: 12px; --fs-sm: 11px; --sp: 8px; }
:root[data-density="compact"] .section-head, :root[data-density="compact"] .tool-head { padding: 7px 12px; }
:root[data-density="compact"] .section-body { padding: 2px 12px 10px; }
:root[data-density="compact"] .tool-body { padding: 1px 12px 11px; }
:root[data-density="compact"] .ds-row { padding: 4px 6px; }
:root[data-density="compact"] .field { margin: 7px 0; }
:root[data-density="compact"] .btn { height: 28px; }
:root[data-density="compact"] .menu-row { padding: 5px 9px; }

/* custom overlay builder */
.cust-exp-head { display: flex; align-items: center; gap: 8px; margin: 14px 0 4px; font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); }
.cust-exp-head:first-of-type { margin-top: 8px; }
.cust-list { display: flex; flex-direction: column; gap: 1px; border-left: 2px solid var(--border); padding-left: 8px; margin-left: 2px; }
.cust-item { border-radius: var(--r-sm); }
.cust-item:hover { background: var(--surface-2); }
.cust-avg { color: var(--text-2); font-style: italic; }

/* floating context menu (chart right-click on a selection) */
.ctx-menu { position: fixed; display: block; z-index: 400; min-width: 200px; }
.menu-row.danger { color: var(--danger); }
.menu-row.danger:hover { background: var(--danger); color: #fff; }

/* On-chart title: transparent hit-area over the renderer-drawn title, so the
 * title shown on the graph (and in exports) is itself clickable to rename. */
.chart-title-hit { position: absolute; display: flex; align-items: center; justify-content: flex-end; padding-right: 4px;
  cursor: text; border-radius: var(--r-sm); box-shadow: inset 0 0 0 1px transparent; transition: box-shadow .12s, background .12s; z-index: 4; }
.chart-title-hit:hover { background: color-mix(in srgb, var(--surface) 62%, transparent); box-shadow: inset 0 0 0 1px var(--border-2); }
.chart-title-pencil { width: 13px; height: 13px; color: var(--text-3); opacity: 0; transition: opacity .12s; }
.chart-title-hit:hover .chart-title-pencil { opacity: .85; }
.chart-title-pencil svg { width: 13px; height: 13px; display: block; }
.chart-title-input { position: absolute; z-index: 5; text-align: center; background: var(--surface); border: 1px solid var(--accent);
  border-radius: var(--r-sm); padding: 0 8px; color: var(--text); font-size: var(--fs-sm); font-weight: 700; outline: none; box-shadow: 0 0 0 3px var(--accent-weak); }

/* hollow swatch: a custom item that isn't graphed yet has no assigned color */
.tt-swatch.hollow { background: transparent; border: 1px dashed var(--text-3); box-shadow: none; }
.tt-swatch.clickable { width: 12px; height: 12px; border-radius: 3px; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
.tt-swatch.clickable:hover { box-shadow: inset 0 0 0 1px rgba(0,0,0,.18), 0 0 0 2px var(--accent-weak); }

.split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--text-2); background: var(--surface-3); border-radius: 20px; padding: 3px 10px; }
.tag-warn { color: #9a6b00; }
:root[data-theme=dark] .tag-warn { color: #e0b64d; }

</style>
</head>
<body>
<div id="app">
  <!-- ============================ MENU BAR ============================ -->
  <header class="menubar" id="menubar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="1" y="1" width="22" height="22" rx="6" fill="var(--accent)"/>
        <path d="M8 17V9a4 4 0 0 1 8 0v8" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="17.5" r="2.6" fill="#fff"/>
        <path d="M12 15.2V7.5" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span>ThermoScope<span class="sub"> · thermal data studio</span></span>
    </div>
    <nav id="menus" style="display:flex;gap:2px"></nav>
    <div class="spacer"></div>
    <div class="status-chip" id="folderChip">No data loaded</div>
    <button class="btn ghost icon" id="themeBtn" title="Toggle light / dark"></button>
  </header>

  <!-- ============================ TOOLBAR ============================ -->
  <div class="toolbar" id="toolbar">
    <div class="group">
      <button class="btn primary" id="openFolderBtn" title="Open a folder of DAQami CSV exports (Ctrl+O)"><span class="ic"></span> Open Data Folder</button>
      <button class="btn" id="organizeBtn" title="Review, rename, and export the organized data as CSV" disabled><span class="ic"></span> Organize &amp; Export</button>
    </div>
    <div class="divider"></div>
    <div class="group" id="undoGroup">
      <button class="btn icon" id="undoBtn" title="Undo (Ctrl+Z)" disabled></button>
      <button class="btn icon" id="redoBtn" title="Redo (Ctrl+Y)" disabled></button>
    </div>
    <div class="divider"></div>
    <div class="group">
      <button class="btn" id="exportPngBtn" title="Export the current graph as a high-resolution PNG image" disabled><span class="ic"></span> PNG</button>
      <button class="btn" id="exportSvgBtn" title="Export the current graph as a scalable vector SVG" disabled><span class="ic"></span> SVG</button>
    </div>
    <div class="spacer" style="flex:1"></div>
    <div class="group">
      <button class="btn ghost icon" id="toggleLeftBtn" title="Toggle data panel"></button>
      <button class="btn ghost icon" id="toggleRightBtn" title="Toggle analysis panel"></button>
    </div>
  </div>

  <!-- ============================ WORKSPACE ============================ -->
  <div class="workspace">
    <aside class="panel panel-left" id="panelLeft">
      <div class="panel-scroll" id="leftScroll"></div>
    </aside>

    <div class="center">
      <div class="tabs" id="tabs">
        <button class="tab on" data-tab="chart" title="The interactive plot and analysis tools">Graph</button>
        <button class="tab" data-tab="raw" title="Browse the parsed sample table for each trial">Raw Data</button>
        <button class="tab" data-tab="details" title="Metadata and parsing notes for the loaded files">Details</button>
      </div>
      <div class="tab-body">
        <!-- CHART -->
        <section class="tab-pane on" data-pane="chart">
          <div class="chart-toolbar" id="chartToolbar"></div>
          <div class="chart-stage">
            <div class="chart-wrap" id="chartWrap">
              <canvas id="chart"></canvas>
              <div class="empty" id="chartEmpty">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>
                <h3>No data to graph yet</h3>
                <p>Open a folder of DAQami <code>.csv</code> exports to begin. Files are grouped automatically by their <b>E#T#</b> names.</p>
                <button class="btn primary" id="openFolderBtn2">Open Data Folder</button>
              </div>
            </div>
            <div class="y-pan"><input type="range" class="slider" id="yPan" min="0" max="1000" value="500" title="Pan the temperature (Y) axis — or Alt+scroll over the chart" disabled></div>
          </div>
          <div class="x-pan-row">
            <span class="zoom-hint" id="zoomHint">Scroll: zoom · Ctrl+scroll: X · Alt+scroll: Y · drag: pan</span>
            <input type="range" class="slider" id="xPan" min="0" max="1000" value="500" title="Pan the time (X) axis — or Ctrl+scroll over the chart" disabled>
          </div>
        </section>
        <!-- RAW -->
        <section class="tab-pane" data-pane="raw">
          <div class="raw-wrap" id="rawWrap"></div>
        </section>
        <!-- DETAILS -->
        <section class="tab-pane" data-pane="details">
          <div class="details-wrap" id="detailsWrap"></div>
        </section>
      </div>
    </div>

    <aside class="panel panel-right" id="panelRight">
      <div class="panel-scroll" id="rightScroll"></div>
    </aside>
  </div>

  <!-- ============================ STATUS BAR ============================ -->
  <footer class="statusbar" id="statusbar">
    <div class="sb-item" id="sbMode"></div>
    <div class="sb-item" id="sbHover"></div>
    <div class="sb-spacer"></div>
    <div class="sb-item" id="sbCount"></div>
  </footer>
</div>

<div class="tooltip" id="tooltip"></div>
<div class="overlay" id="overlay"></div>
<div class="toast-host" id="toastHost"></div>
<input type="file" id="folderInput" webkitdirectory directory multiple style="display:none">

<script>
/* =============================================================================
 * theme.js — Color tokens for the two themes.
 *
 * Two parallel things per theme:
 *   - CSS custom properties applied to <html data-theme> (drive all UI chrome).
 *   - A plain object handed to the canvas/SVG renderer (which cannot read CSS
 *     variables), kept in sync from the same source so the chart never drifts
 *     from the UI.
 *
 * The categorical series palette is the validated, colorblind-safe set from the
 * data-viz reference (worst adjacent CVD ΔE well clear of target), stepped
 * separately for the light and dark chart surfaces.
 * ============================================================================= */
(function (TS) {
  'use strict';

  // Categorical series palette — a refined, muted, publication-quality set. The
  // colors sit in a mid saturation/lightness band so nothing reads as neon or as
  // near-black; each surface has its own tuning so lines stay legible on white and
  // on the dark plot. Ordering interleaves the wheel so the first few (the common
  // small-N case) are maximally distinct, leading with the colorblind-safe
  // blue/orange/green trio.
  var MUTED = {
    light: ['#3b6ea5', '#cf8a3c', '#4e9e6b', '#8465ad', '#c25863', '#3a9aa4', '#b9993f', '#bd6fa0', '#7f9350', '#5566a8', '#a0714f', '#6d7885'],
    dark:  ['#6d9fd6', '#e0a765', '#6cbf8c', '#a98fd0', '#db8189', '#5fbcc6', '#d2bd6a', '#d29ac0', '#a7b877', '#8593d6', '#c2926f', '#949eab'],
  };
  // "Vibrant" is the same hues pushed to a higher saturation — noticeably more
  // colorful, but capped so it never blows out or hurts legibility. Derived from
  // MUTED so the two sets share identity and switching only changes intensity.
  function vivify(hex, theme) {
    var c = hexToHsl(hex);
    var s = Math.min(theme === 'dark' ? 70 : 74, c.s * 1.42);
    return hslToHex(c.h, s, c.l);
  }
  var VIVID = {
    light: MUTED.light.map(function (h) { return vivify(h, 'light'); }),
    dark:  MUTED.dark.map(function (h) { return vivify(h, 'dark'); }),
  };
  var PALETTES = { muted: MUTED, vibrant: VIVID };
  var variant = 'muted';                 // active palette variant
  function paletteFor(theme) { return (PALETTES[variant] || MUTED)[theme] || MUTED.light; }
  // Kept for back-compat: a live view of the active variant's palette.
  var SERIES = { get light() { return paletteFor('light'); }, get dark() { return paletteFor('dark'); } };

  var THEMES = {
    light: {
      // UI chrome
      '--bg':            '#f2f3f4',
      '--surface':       '#ffffff',
      '--surface-2':     '#f7f8f9',
      '--surface-3':     '#eceef0',
      '--sunken':        '#e9ebed',
      '--text':          '#16191d',
      '--text-2':        '#4a5158',
      '--text-3':        '#7b828a',
      '--border':        '#d8dce0',
      '--border-2':      '#e6e9ec',
      '--accent':        '#2f6feb',
      '--accent-weak':   '#e5edfd',
      '--accent-text':   '#1b56c9',
      '--danger':        '#d03b3b',
      '--good':          '#0c8f3f',
      '--warn-ink':      '#9a6a00',
      '--warn-weak':     '#fdf3dd',
      '--warn-border':   '#efd9a3',
      '--shadow':        '0 1px 2px rgba(16,19,26,0.06), 0 4px 16px rgba(16,19,26,0.08)',
      '--shadow-sm':     '0 1px 2px rgba(16,19,26,0.08)',
      '--menu-shadow':   '0 6px 24px rgba(16,19,26,0.16)',
    },
    dark: {
      '--bg':            '#0e1116',
      '--surface':       '#171b21',
      '--surface-2':     '#1c2129',
      '--surface-3':     '#232935',
      '--sunken':        '#10141a',
      '--text':          '#e8ebef',
      '--text-2':        '#a7b0bb',
      '--text-3':        '#6f7883',
      '--border':        '#2a313b',
      '--border-2':      '#222833',
      '--accent':        '#4f8cff',
      '--accent-weak':   '#182338',
      '--accent-text':   '#7aa8ff',
      '--danger':        '#e66767',
      '--good':          '#3fce7a',
      '--warn-ink':      '#e0b24d',
      '--warn-weak':     '#2a2413',
      '--warn-border':   '#4a3f1e',
      '--shadow':        '0 1px 2px rgba(0,0,0,0.4), 0 8px 28px rgba(0,0,0,0.5)',
      '--shadow-sm':     '0 1px 2px rgba(0,0,0,0.4)',
      '--menu-shadow':   '0 10px 34px rgba(0,0,0,0.6)',
    },
  };

  // Colors the renderer needs (chart surface, grid, axis, ink, boundary).
  var CHART = {
    light: {
      surface:    '#ffffff',
      plotBg:     '#ffffff',
      gridMajor:  '#e3e6ea',
      gridMinor:  '#eef1f3',
      axis:       '#9aa1a9',
      axisStrong: '#5b636c',
      zeroLine:   '#c7ccd2',
      text:       '#3a424b',
      mutedText:  '#7b828a',
      boundary:   '#8a919a',
      labelBg:    '#ffffff',
      crosshair:  '#2f6feb',
    },
    dark: {
      surface:    '#141922',
      plotBg:     '#141922',
      gridMajor:  '#262d38',
      gridMinor:  '#1d222b',
      axis:       '#5b636e',
      axisStrong: '#9aa3ae',
      zeroLine:   '#333b47',
      text:       '#b7bec8',
      mutedText:  '#7f8896',
      boundary:   '#727b87',
      labelBg:    '#141922',
      crosshair:  '#5f9bff',
    },
  };

  function seriesColor(theme, index) {
    var arr = paletteFor(theme);
    return arr[((index % arr.length) + arr.length) % arr.length];
  }

  /* ---- HSL <-> hex, for generating/adjusting hues beyond the curated set ---- */
  function hslToHex(h, s, l) {
    h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
    var c = (1 - Math.abs(2 * l - 1)) * s;
    var x = c * (1 - Math.abs(((h / 60) % 2) - 1));
    var m = l - c / 2, r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; }
    else if (h < 120) { r = x; g = c; }
    else if (h < 180) { g = c; b = x; }
    else if (h < 240) { g = x; b = c; }
    else if (h < 300) { r = x; b = c; }
    else { r = c; b = x; }
    function hx(v) { return ('0' + Math.round((v + m) * 255).toString(16)).slice(-2); }
    return '#' + hx(r) + hx(g) + hx(b);
  }
  function hexToHsl(hex) {
    var r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, h = 0, l = (mx + mn) / 2;
    var s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
    if (d) { if (mx === r) h = ((g - b) / d) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4; h *= 60; if (h < 0) h += 360; }
    return { h: h, s: s * 100, l: l * 100 };
  }
  var isVibrant = function () { return variant === 'vibrant'; };

  /* -----------------------------------------------------------------------------
   * scale(theme, n) — return n maximally distinct, professional colors.
   *   • n within the curated palette  -> the curated colors (already ordered for
   *     maximum separation), so small graphs get the hand-tuned hues.
   *   • n beyond the palette           -> a fully generated even-hue ramp so that
   *     large graphs still get n *distinct* colors instead of cycling/repeating.
   * This is what makes "20 datasets" show 20 different colors rather than three
   * of them landing on the same hue.

<script>
/* =============================================================================
 * parser.js — Reads a raw DAQami CSV export into a structured trial object.
 *
 * DAQami exports look like:
 *
 *   "Device: USB-2408-2AO"
 *   "Serial Number: 2060DB1"
 *   "Channel Count: 2"
 *   "Sample Count: 601"
 *   "Start Time: 7/8/2026 2:26:29.4 PM"
 *   "Scan Rate: 10"
 *   "Sample","Date/Time","AI0 (°C)","AI1 (°C)"
 *   "0","7/8/2026 2:26:29.4 PM","27.116","27.514"
 *   ...
 *
 * Notes that shape this parser:
 *   - UTF-8 with a leading BOM, CRLF line endings, every field quoted.
 *   - The metadata block can be any number of lines; the real landmark is the
 *     header row whose first field is literally "Sample".
 *   - Two time formats exist: "Date/Time" (absolute clock) and "Time (s)"
 *     (seconds since start). Clock times are converted to seconds using the
 *     file's own "Start Time".
 *   - Channel count varies; every column after the time column is a channel.
 *   - The experiment/trial numbers come from the filename prefix, which is
 *     auto-detected (or matched against a user-supplied template).
 * ============================================================================= */
(function (TS) {
  'use strict';

  // Auto-detects an "experiment then trial" prefix: E1T1, E1 T1, E1-T1,
  // Experiment 1 - Trial 1, Exp1 Tr1, Ex1 * Tr1, etc. (anchored to the start).
  var AUTO_RE = /^\s*e(?:xp(?:eriment)?)?[^0-9]*?(\d+)[^0-9]*?t(?:r(?:ial)?)?[^0-9]*?(\d+)/i;
  var CLOCK_RE =
    /^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2}):(\d{2})(?:\.(\d+))?\s*(AM|PM)?$/i;

  /* Split one physical CSV line into fields, honoring quotes and "" escapes. */
  function parseCsvLine(line) {
    var out = [];
    var field = '';
    var inQuotes = false;
    for (var i = 0; i < line.length; i++) {
      var c = line[i];
      if (inQuotes) {
        if (c === '"') {
          if (line[i + 1] === '"') { field += '"'; i++; }
          else { inQuotes = false; }
        } else {
          field += c;
        }

        if (c === '"') inQuotes = true;
        else if (c === ',') { out.push(field); field = ''; }
        else field += c;

  /* "AI0 (°C)" -> { name: "AI0", unit: "°C" }.  Gracefully handles no unit. */
  function splitChannelHeader(text) {
    var m = /^(.*?)\s*\(([^)]*)\)\s*$/.exec(text.trim());
    if (m) return { name: m[1].trim(), unit: m[2].trim() };
    return { name: text.trim(), unit: '' };

  /* Parse a DAQami clock timestamp to epoch ms (UTC, so it is timezone-proof —
   * these values are only ever subtracted from one another). */

    if (text == null) return NaN;
    var m = CLOCK_RE.exec(String(text).trim());

    var month = +m[1], day = +m[2], year = +m[3];
    var hour = +m[4], min = +m[5], sec = +m[6];
    var frac = m[7] ? parseFloat('0.' + m[7]) : 0;
    var mer = m[8] ? m[8].toUpperCase() : null;

    else if (mer === 'AM' && hour === 12) hour = 0;

   * plain seconds ("35.949") OR a colon-separated elapsed clock — "SS.mmm",
   * "M:SS.mmm", or "H:MM:SS.mmm" (e.g. "1:07.542" -> 67.542). A naive parseFloat
   * silently returns 0 for the colon forms, which is exactly the "all times 0"
   * bug, so every colon-part is folded in base-60. */

    if (str.indexOf(':') < 0) return parseFloat(str);
    var parts = str.split(':'), total = 0;
    for (var i = 0; i < parts.length; i++) {

  /* Turn a user template like "E{e}T{t}" or "Experiment {e} - Trial {t}" into a
   * matching regex. {e}/{t} become number captures; everything else is literal. */

  /* Parse "E3T4 - Analog - ... .csv" -> { experiment: 3, trial: 4 }. */

    var m = (regex || AUTO_RE).exec(base.trim());

    var headerIdx = -1;

      if (rawLines[i] === '') continue;

        filename: filename, error: 'No "Sample" header row found — not a DAQami export.',

    }

    var header = parseCsvLine(rawLines[headerIdx]).map(function (h) { return h.trim(); });
    var timeHeader = header[1] || '';
    var channelHeaders = header.slice(2);

    function isBlank(s) { return s == null || String(s).trim() === ''; }
    function rowBlank(f) { for (var k = 0; k < f.length; k++) if (!isBlank(f[k])) return false; return true; }

    // Decide the time mode from the ACTUAL data, using the header only as a hint.
    // DAQami is normally consistent, but a "Date/Time" header can contain plain
    // seconds (or the reverse); trusting the header alone yields all-NaN times.
    var headerMode = /date\s*\/?\s*time/i.test(timeHeader) ? 'clock'
      : (/time\s*\(s\)|seconds|\(s\)/i.test(timeHeader) ? 'seconds' : null);
    var sniff = null;
    for (var sr = headerIdx + 1; sr < rawLines.length; sr++) {
      if (rawLines[sr].trim() === '') continue;
      var sf = parseCsvLine(rawLines[sr]);
      if (rowBlank(sf) || isBlank(sf[1])) continue;
      sniff = String(sf[1]).trim(); break;
    }
    var timeMode = sniff == null ? (headerMode || 'seconds')
      : CLOCK_RE.test(sniff) ? 'clock'
      : isFinite(parseElapsed(sniff)) ? 'seconds'   // plain seconds OR M:SS.mmm elapsed
      : (headerMode || 'seconds');
    if (headerMode && headerMode !== timeMode) {
      warnings.push('The time column is labelled "' + timeHeader + '" but its values look like ' +
        (timeMode === 'seconds' ? 'plain seconds' : 'clock timestamps') + '; read as ' + timeMode + '.');
    }

    var fn = parseFilename(filename, opts.filenameRegex);
    var startTimeRaw = metaValue(meta, 'Start Time');
    var startMs = startTimeRaw != null ? parseClock(startTimeRaw) : NaN;
    if (timeMode === 'clock' && isNaN(startMs) && sniff != null && CLOCK_RE.test(sniff)) startMs = parseClock(sniff);

    // Collect data rows, defensively.
    var nCh = channelHeaders.length;
    var timeSeconds = [];
    var channelValues = [];
    for (var c = 0; c < nCh; c++) channelValues.push([]);

    var skippedRows = 0, missingVals = 0;
    for (var r = headerIdx + 1; r < rawLines.length; r++) {
      if (rawLines[r] === '' || rawLines[r].trim() === '') continue;
      var fields = parseCsvLine(rawLines[r]);
      if (rowBlank(fields)) continue;                    // ",,," padding lines
      var tcell = fields[1];
      var tSec;
      if (timeMode === 'clock') { tSec = (parseClock(tcell) - startMs) / 1000; }
      else { tSec = isBlank(tcell) ? NaN : parseElapsed(tcell); }
      if (!isFinite(tSec)) { skippedRows++; continue; }  // unusable time -> drop row
      timeSeconds.push(tSec);
      for (var cc = 0; cc < nCh; cc++) {
        var rawv = fields[cc + 2];
        var v = isBlank(rawv) ? NaN : parseFloat(rawv);
        if (isNaN(v)) missingVals++;
        channelValues[cc].push(v);
      }
    }

    // Data-quality warnings.
    var declaredSamples = metaValue(meta, 'Sample Count');
    if (nCh === 0) warnings.push('No measurement channels were found in this file.');
    if (timeSeconds.length === 0) warnings.push('No usable data rows were found in this file.');
    if (skippedRows > 0) warnings.push(skippedRows + ' row' + (skippedRows > 1 ? 's were' : ' was') + ' skipped (no readable time value).');
    if (missingVals > 0) warnings.push(missingVals + ' missing measurement' + (missingVals > 1 ? 's' : '') + ' (blank cells) kept as gaps.');
    if (startTimeRaw == null && timeMode === 'clock') warnings.push('Start Time was missing; time was zeroed against the first sample.');
    if (declaredSamples != null && isFinite(+declaredSamples) && +declaredSamples !== timeSeconds.length)
      warnings.push('Header lists ' + declaredSamples + ' samples but ' + timeSeconds.length + ' were read.');
    if (fn.experiment === null) warnings.push('Filename does not match the experiment/trial pattern; experiment/trial unknown.');

    // Monotonicity / duplicate checks (interpolation assumes increasing time).
    var nonMono = false, dup = false;
    for (var mi = 1; mi < timeSeconds.length; mi++) {
      if (timeSeconds[mi] < timeSeconds[mi - 1]) nonMono = true;
      else if (timeSeconds[mi] === timeSeconds[mi - 1]) dup = true;
    }
    if (nonMono) warnings.push('Time values are not strictly increasing — some analysis may be approximate.');
    else if (dup) warnings.push('Some time values are duplicated.');

    var channels = channelHeaders.map(function (h, idx) {
      var sc = splitChannelHeader(h);
      return {
        name: sc.name, unit: sc.unit, header: h,
        values: Float64Array.from(channelValues[idx]),
      };
    });

    return {
      filename: filename,
      experiment: fn.experiment,
      trial: fn.trial,
      device: metaValue(meta, 'Device'),
      serialNumber: metaValue(meta, 'Serial Number'),
      channelCount: channels.length,
      sampleCount: timeSeconds.length,
      declaredSampleCount: declaredSamples != null && isFinite(+declaredSamples) ? +declaredSamples : null,
      startTimeRaw: startTimeRaw,
      startMs: isNaN(startMs) ? null : startMs,
      scanRate: metaValue(meta, 'Scan Rate') != null ? parseFloat(metaValue(meta, 'Scan Rate')) : null,
      timeMode: timeMode,
      timeSeconds: Float64Array.from(timeSeconds),
      channels: channels,
      rowCount: timeSeconds.length,
      meta: meta,
      warnings: warnings,
      error: null,
    };
  }

    parseDaqamiCsv: parseDaqamiCsv,
    parseCsvLine: parseCsvLine,
    parseClock: parseClock,
    parseElapsed: parseElapsed,
    parseFilename: parseFilename,

    splitChannelHeader: splitChannelHeader,

<script>
/* =============================================================================
 * datamodel.js — Turns flat parsed trials into experiments, assigns stable ids
 * and default styles, and answers "which datasets belong on the chart right now"
 * for the active graph mode.
 *
 * A "dataset" is the smallest addressable unit: one channel of one trial
 * (e.g. E1T2's AI0). Its id is a stable string used everywhere (styles, undo,
 * session files), so nothing depends on load order.
 * ============================================================================= */
(function (TS) {
  'use strict';

  var SHAPES = ['circle', 'square', 'triangle', 'diamond', 'cross', 'star', 'triangleDown', 'plus'];

  var MODES = {
    BY_SENSOR: { id: 'BY_SENSOR', label: 'One Sensor · All Trials',  hint: 'Pick a sensor; every trial is drawn as its own line' },
    BY_TRIAL:  { id: 'BY_TRIAL',  label: 'One Trial · All Sensors', hint: 'Pick a trial; every sensor is drawn as its own line' },
    ALL:       { id: 'ALL',       label: 'Full Overview',   hint: 'Every sensor of every trial at once' },
  };

  var SEP = '::';

  function datasetId(exp, trial, channelName) {
    return 'E' + exp + 'T' + trial + SEP + channelName;
  }
  function parseDatasetId(id) {
    var si = id.indexOf(SEP);
    var head = id.slice(0, si);
    var channelName = id.slice(si + SEP.length);
    var m = /^E(\d+)T(\d+)$/.exec(head);
    if (!m) return null;
    return { experiment: +m[1], trial: +m[2], channelName: channelName };
  }

  function buildExperiments(parsedTrials) {
    var byExp = {};
    parsedTrials.forEach(function (t) {
      if (t.error || t.experiment == null) return;
      var k = t.experiment;
      (byExp[k] = byExp[k] || []).push(t);
    });
    var experiments = Object.keys(byExp).map(function (k) {
      var trials = byExp[k].slice().sort(function (a, b) { return a.trial - b.trial; });
      // Disambiguate duplicate trial numbers (two files claiming the same E#T#)
      // by reassigning collisions to the next free number so no data is silently
      // merged/hidden; the file keeps a warning noting the change.
      var seen = {}, maxT = 0;
      trials.forEach(function (tr) { if (tr.trial > maxT) maxT = tr.trial; });
      trials.forEach(function (tr) {
        if (seen[tr.trial]) {
          var orig = tr.trial; maxT += 1;
          tr.warnings = (tr.warnings || []).concat(['Another file already used trial ' + orig +
            ' in experiment ' + k + '; shown here as trial ' + maxT + '. Rename the file to fix this.']);
          tr.trial = maxT;

        seen[tr.trial] = true;

      trials.forEach(function (tr) {
        tr.channels.forEach(function (ch) { if (names.indexOf(ch.name) < 0) names.push(ch.name); });
      });

    });

   * reloading the same folder yields the same defaults. */

    var styles = {};
    var i = 0;
    experiments.forEach(function (exp) {
      exp.trials.forEach(function (tr) {
        tr.channels.forEach(function (ch) {
          var id = datasetId(exp.number, tr.trial, ch.name);
          styles[id] = {
            colorIndex: i,   // global, stable index into a palette sized to the dataset count
            customColor: null,  // hand-set color (fixed); null = follow arrange/auto
            arrange: null,      // Color Manager assignment: {type:'hue',hue,frac} | {type:'slot',slot,total}
            shape: SHAPES[i % SHAPES.length],
            visibility: 'on', // 'on' | 'dim' | 'off'
            unit: ch.unit,
          };
          i++;
        });
      });
    });
    return styles;
  }

  function findExperiment(experiments, number) {
    for (var i = 0; i < experiments.length; i++) if (experiments[i].number === number) return experiments[i];
    return null;
  }

  function trialNumbers(exp) { return exp ? exp.trials.map(function (t) { return t.trial; }) : []; }

  /* Ordered dataset ids for the active mode.
   *   BY_SENSOR: selector = channel name  -> that channel across all trials
   *   BY_TRIAL:  selector = trial number  -> all channels of that trial
   *   ALL:       every channel of every trial
   */

    if (!exp) return [];
    var ids = [];
    if (mode === 'BY_SENSOR') {
      exp.trials.forEach(function (tr) {
        tr.channels.forEach(function (ch) {
          if (ch.name === selector) ids.push(datasetId(exp.number, tr.trial, ch.name));
        });
      });
    } else if (mode === 'BY_TRIAL') {
      exp.trials.forEach(function (tr) {
        if (tr.trial === selector) {
          tr.channels.forEach(function (ch) { ids.push(datasetId(exp.number, tr.trial, ch.name)); });
        }
      });
    } else { // ALL
      exp.trials.forEach(function (tr) {
        tr.channels.forEach(function (ch) { ids.push(datasetId(exp.number, tr.trial, ch.name)); });
      });
    }
    return ids;
  }

  function resolveDatasetData(experiments, id) {
    var p = parseDatasetId(id);
    if (!p) return null;
    var exp = findExperiment(experiments, p.experiment);
    if (!exp) return null;
    var trial = null;
    for (var i = 0; i < exp.trials.length; i++) if (exp.trials[i].trial === p.trial) { trial = exp.trials[i]; break; }
    if (!trial) return null;
    var channel = null;
    for (var j = 0; j < trial.channels.length; j++) if (trial.channels[j].name === p.channelName) { channel = trial.channels[j]; break; }
    if (!channel) return null;
    return {
      xs: trial.timeSeconds,
      ys: channel.values,
      unit: channel.unit,
      trial: trial,
      channel: channel,
      experiment: exp.number,
      trialNumber: trial.trial,
      channelName: channel.name,
      label: 'E' + exp.number + 'T' + trial.trial + ' · ' + channel.name,
      shortLabel: 'T' + trial.trial + ' · ' + channel.name,
    };
  }

  /* A label describing a dataset in the context of the current mode (keeps the
   * legend uncluttered — trials in Compare Trials, sensors in Compare Sensors). */
  function datasetLabelForMode(experiments, id, mode) {
    var d = resolveDatasetData(experiments, id);
    if (!d) return id;
    if (mode === 'BY_SENSOR') return 'Trial ' + d.trialNumber;
    if (mode === 'BY_TRIAL') return d.channelName;
    return d.label;
  }

  TS.DataModel = {
    SHAPES: SHAPES,
    MODES: MODES,
    datasetId: datasetId,
    parseDatasetId: parseDatasetId,
    buildExperiments: buildExperiments,
    defaultStyles: defaultStyles,
    findExperiment: findExperiment,
    trialNumbers: trialNumbers,
    datasetIdsForMode: datasetIdsForMode,
    resolveDatasetData: resolveDatasetData,
    datasetLabelForMode: datasetLabelForMode,
  };
})(window.TS = window.TS || {});

/* =============================================================================
 * analysis.js — Pure numeric routines for the analysis tools. No DOM, no chart
 * code: each function takes arrays and returns numbers/arrays, so they can be
 * reasoned about and tested in isolation.
 * ============================================================================= */
(function (TS) {
  'use strict';

  /* Largest index i with xs[i] <= x (binary search); -1 if x < xs[0]. */
  function floorIndex(xs, x) {
    var lo = 0, hi = xs.length - 1;
    if (hi < 0 || x < xs[0]) return -1;
    if (x >= xs[hi]) return hi;
    while (lo < hi) {
      var mid = (lo + hi + 1) >> 1;
      if (xs[mid] <= x) lo = mid; else hi = mid - 1;
    }
    return lo;

  function nearestIndex(xs, x) {
    var i = floorIndex(xs, x);
    if (i < 0) return 0;
    if (i >= xs.length - 1) return xs.length - 1;
    return (x - xs[i] <= xs[i + 1] - x) ? i : i + 1;

  /* Piecewise-linear interpolation; NaN outside the data range. */
  function linearInterp(xs, ys, x) {

    var i = floorIndex(xs, x);

    if (i >= n - 1) return ys[n - 1];

   * timestamps, and out-of-order rows can't produce Inf/NaN in the spline. */

    if (n === 0) return function () { return NaN; };
    if (n === 1) { var only = ys[0]; return function () { return only; }; }
    var h = new Float64Array(Math.max(n - 1, 0));
    var delta = new Float64Array(Math.max(n - 1, 0));
    var i;

<script>
/* =============================================================================
 * organizer.js — Builds the Excel-friendly organized CSV.
 *
 * Layout: every trial gets its own Time + channel column group (no resampling,
 * no interpolation, no precision loss) so an Excel XY-scatter of one experiment
 * plots every trial correctly on its own X values with no manual series editing.
 *
 * Options (per the requested tweaks):
 *   - layout: 'stacked'  -> experiment tables placed one above the next
 *             'sideBySide'-> experiment tables placed in adjacent column ranges
 *   - includeHeader: include the per-trial detail table (device, date, scan
 *     rate, duration, ...) above each experiment's data.
 * ============================================================================= */

  'use strict';

    if (v == null) return '';

    return s;

  function fmt(v, dp) {
    if (v == null || isNaN(v)) return '';

  }

  function trialDate(tr) {
    if (tr.startTimeRaw) {
      var m = /^(\d{1,2}\/\d{1,2}\/\d{4})/.exec(tr.startTimeRaw);
      if (m) return m[1];

  function trialClock(tr) {
    if (tr.startTimeRaw) {
      var m = /\d{1,2}\/\d{1,2}\/\d{4}\s+(.*)$/.exec(tr.startTimeRaw);
      if (m) return m[1];

    var t = tr.timeSeconds;
    return t && t.length ? t[t.length - 1] - t[0] : 0;
  }

  /* Build one experiment as a rectangular grid of raw cell values. */
  function buildBlock(exp, opts) {

    var rows = [];
    var trials = exp.trials;

    rows.push(['Experiment ' + exp.number]);

    if (opts.includeHeader) {
      rows.push(['Trial', 'Source File', 'Device', 'Date', 'Start Time',
        'Time Format', 'Scan Rate (Hz)', 'Channels', 'Samples', 'Duration (s)']);
      trials.forEach(function (tr) {
        rows.push([
          'Trial ' + tr.trial, tr.filename, tr.device || '', trialDate(tr), trialClock(tr),
          tr.timeMode === 'clock' ? 'Date/Time (clock)' : 'Time (s)',
          tr.scanRate != null ? tr.scanRate : '',

          tr.sampleCount, fmt(duration(tr), timeDp),

    var groupRow = [];

      if (ti > 0) { groupRow.push(''); headerRow.push(''); } // spacer column between trials
      groupRow.push('Trial ' + tr.trial);
      headerRow.push('Time (s)');
      tr.channels.forEach(function (ch, ci) {
        if (ci > 0) groupRow.push('');
        headerRow.push(opts.convert ? (ch.name + ' (' + opts.convert.unit + ')')
          : (ch.header || (ch.name + (ch.unit ? ' (' + ch.unit + ')' : ''))));
      });
    });
    rows.push(groupRow);
    rows.push(headerRow);

    // Data rows.
    var maxLen = 0;
    trials.forEach(function (tr) { maxLen = Math.max(maxLen, tr.timeSeconds.length); });
    for (var r = 0; r < maxLen; r++) {
      var row = [];
      trials.forEach(function (tr, ti) {

        if (r < tr.timeSeconds.length) {
          row.push(fmt(tr.timeSeconds[r], timeDp));
          tr.channels.forEach(function (ch) { row.push(fmt(opts.convert ? opts.convert.fn(ch.values[r]) : ch.values[r], valDp)); });
        } else {
          row.push('');
          tr.channels.forEach(function () { row.push(''); });

      rows.push(row);
    }

    var width = 0;
    rows.forEach(function (r) { width = Math.max(width, r.length); });
    rows.forEach(function (r) { while (r.length < width) r.push(''); });

    var opts = Object.assign({
      layout: 'stacked', includeHeader: true, timeDecimals: 3, valueDecimals: 4,

    var grid = [];

    if (opts.layout === 'sideBySide') {

      blocks.forEach(function (b) { height = Math.max(height, b.rows.length); });

        b.rows.forEach(function (row) { grid.push(row); });

    return grid.map(function (row) {
      return row.map(csvEscape).join(',');
    }).join('\r\n') + '\r\n';
  }

    moveTo: function (x, y) { this._path += 'M' + r2(x) + ' ' + r2(y) + ' '; },

  function r2(n) { return Math.round(n * 100) / 100; }

  /* --------------------------- Scales & ticks ----------------------------- */
  function makeScale(dMin, dMax, pMin, pMax) {
    if (dMin === dMax) { dMin -= 1; dMax += 1; }
    var m = (pMax - pMin) / (dMax - dMin);
    return {
      dataMin: dMin, dataMax: dMax, pixMin: pMin, pixMax: pMax,
      toPixel: function (v) { return pMin + (v - dMin) * m; },
      toData: function (p) { return dMin + (p - pMin) / m; },
    };
  }

  function niceTicks(min, max, target) {
    if (min === max) { min -= 1; max += 1; }
    var range = max - min;
    var rawStep = range / Math.max(1, target);
    var mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
    var norm = rawStep / mag;
    var step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
    var start = Math.ceil(min / step) * step;
    var ticks = [];
    for (var v = start; v <= max + step * 1e-6; v += step) {
      ticks.push(Math.abs(v) < step * 1e-6 ? 0 : v);
    }
    return { ticks: ticks, step: step };
  }

  function fmtTick(v, step) {
    var dp = step < 0.001 ? 4 : step < 0.01 ? 3 : step < 0.1 ? 2 : step < 1 ? 1 : 0;
    if (Math.abs(v) >= 100000) return v.toExponential(1);
    return v.toFixed(dp);
  }

  /* ------------------------------ Markers --------------------------------- */
  function drawMarker(rd, shape, cx, cy, size, style) {
    var r = size;
    function poly(pts) {
      rd.beginPath();
      for (var i = 0; i < pts.length; i++) { if (i === 0) rd.moveTo(pts[i][0], pts[i][1]); else rd.lineTo(pts[i][0], pts[i][1]); }
      rd.closePath(); rd.fillPath(style);
    }
    switch (shape) {
      case 'square': poly([[cx - r, cy - r], [cx + r, cy - r], [cx + r, cy + r], [cx - r, cy + r]]); break;
      case 'triangle': poly([[cx, cy - r * 1.15], [cx + r, cy + r * 0.85], [cx - r, cy + r * 0.85]]); break;
      case 'triangleDown': poly([[cx, cy + r * 1.15], [cx + r, cy - r * 0.85], [cx - r, cy - r * 0.85]]); break;
      case 'diamond': poly([[cx, cy - r * 1.25], [cx + r * 1.15, cy], [cx, cy + r * 1.25], [cx - r * 1.15, cy]]); break;
      case 'cross':
        rd.beginPath(); rd.moveTo(cx - r, cy - r); rd.lineTo(cx + r, cy + r);
        rd.moveTo(cx + r, cy - r); rd.lineTo(cx - r, cy + r);
        rd.strokePath({ color: style.color, width: Math.max(1.4, r * 0.7), alpha: style.alpha }); break;
      case 'plus':
        rd.beginPath(); rd.moveTo(cx - r, cy); rd.lineTo(cx + r, cy);
        rd.moveTo(cx, cy - r); rd.lineTo(cx, cy + r);
        rd.strokePath({ color: style.color, width: Math.max(1.4, r * 0.7), alpha: style.alpha }); break;
      case 'star': {
        var pts = [];
        for (var i = 0; i < 10; i++) {
          var ang = -Math.PI / 2 + i * Math.PI / 5;
          var rad = (i % 2 === 0) ? r * 1.25 : r * 0.5;
          pts.push([cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad]);

        poly(pts); break;
      }
